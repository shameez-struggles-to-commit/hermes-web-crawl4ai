[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-web-crawl4ai"
version = "0.1.0"
description = "Standalone Crawl4AI web extraction and bounded crawling plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "axAilotl" }]
# scrapling powers the stealth-escalation leg. Declared here (not only as an extra) so Hermes' package manager
# installs it into the managed environment and re-applies it after every `hermes update`.
dependencies = ["httpx>=0.27,<1", "scrapling[fetchers]==0.4.14"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.entry-points."hermes_agent.plugins"]
hermes-web-crawl4ai = "hermes_web_crawl4ai"

[project.urls]
Repository = "https://github.com/axAilotl/hermes-web-crawl4ai"
Issues = "https://github.com/axAilotl/hermes-web-crawl4ai/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "ruff>=0.9,<1"]
# Stealth-escalation leg (challenge/block fallback fetch). The plugin also
# self-installs this pin at runtime on first use; the extra is for hosts that
# prefer eager/declarative installs. Browser engines are provisioned
# separately via `scrapling install` (chromium via patchright).
stealth = ["scrapling[fetchers]==0.4.14"]

[tool.hatch.build.targets.wheel]
packages = ["hermes_web_crawl4ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
